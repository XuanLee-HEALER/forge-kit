fast_track:
  enabled: true
  # The approved task scope and instance delivery path select the endpoint.
  max_endpoint: prod
  allow_prod: true
  forbid_db_rw: true
  max_files_changed: 25
  max_lines_changed: 800
  default_ttl_minutes: 240
  require_independent_review: true
  require_ci_green_for_prod: true
  forbidden_paths:
    - "**/migrations/**"
    - "**/migration/**"
    - "**/auth/**"
    - "**/billing/**"
    - "**/payment/**"
    - "infra/**"
    - ".workbench/**"
    - ".codex/**"
