[kit]
name = "forge-kit"
version = "0.5.5"
runtime = "codex"

[managed]
# Synced idempotently by `forge sync`; NEVER include instance-private paths here.
rendered_files = [
  "AGENTS.md",
  ".codex/hooks.json",
]

agent_files = [
  "scanner.toml", "analyst.toml", "implementer.toml", "reviewer.toml",
  "reviewer-business.toml", "reviewer-quality.toml", "reviewer-simplify.toml", "reviewer-comments.toml",
]
copied_files = [".codex/config.toml"]
bin_bundles = ["cli.js"]
bin_wrappers = ["forge"]

[private]
# Created ONLY on `forge init` if missing; `forge sync` NEVER overwrites these.
init_only = [
  "AGENTS.local.md",
  ".workbench/workbench.yaml",
  ".workbench/models.toml",
  ".workbench/ship-policy.yaml",
  ".workbench/env/environments.example.json",
  "one-off-scripts/README.md",
]
