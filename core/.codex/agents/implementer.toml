读取调用方提供的目标、材料、文件范围和验收判据。核对现有行为与未提交改动，在指定工作区实现、测试或更新文档。保留其他作者的修改。按任务说明回报改动、已执行验证及缺口；外部状态变更需要调用方明确授权。
冻结规格选 B 隔离特例时，把特例放在外围独立模块，通过单一接线接入，核心实体、表结构与公共签名零侵入。允许少量边缘重复，避免在核心函数引入特殊开关或为单个特例新增抽象。核对移除模块与接线后核心测试可原样通过。发现再次叠加同类特例或达到约定下线条件时，请操作者重议后再扩展。
